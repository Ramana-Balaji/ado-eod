# ado-eod rules — shipped defaults.
# Admins override via an org rules file (Phase 2); users via ~/.ado-eod/rules.yaml.
# Later files win per-key. `eod_status` shows which file each rule came from.
version: 1

ado:
  org: "" # set via: npx ado-eod setup --org <yourorg>   (dev.azure.com/<yourorg>)
  project: "" # default project for drafts and reports
  ticketIdPattern: '[A-Z]{2,5}-(\d+)' # how ticket ids appear in your branches/commits, e.g. AB-1234

# Where to look for git repos when attributing work
repoRoots:
  - ~/Documents

applies: # who / what / where this tool may update
  projects: [] # empty = any project the caller can see
  workItemTypes: [] # empty = any type (covers custom process templates)
  onlyMyTickets: true # refuse tickets not assigned to the caller
  blockStates: [] # empty = no state blocks updating

comment: # format + mandatory sections
  format: markdown
  maxLines: 25 # eod_post rejects longer comments — keep them brief
  # required sections are auto-filled from evidence (commits, sessions, ticket title);
  # only what nothing can derive is asked: summary with zero evidence, testScenarios on completion
  required: [summary, next, testScenarios, description, acceptanceCriteria]
  # compact + bulleted by design. The date appears ONCE, in the header — the old
  # `eod:<date>` footer is retired and rejected on post.
  # {{headlineSection}} is the plain-English line for non-technical readers.
  template: |
    **{{workType}}** — {{date}}

    {{headlineSection}}
    {{summary}}
    {{testScenariosSection}}
    **Next:** {{next}}
  signoffTemplate: | # appended ONLY when completion is proposed
    **Status:** complete — tested with {{testerMention}}.
    - {{testerMention}} please confirm and close if it works as expected.

completion:
  maxProposedState: Resolved # tool never proposes Closed — tester closes
  requireTester: true # completion draft without a tester → ask

# Test-scenario / acceptance-criteria fields are DISCOVERED from each work item type's
# own field list in the target project, so custom process templates work out of the box.
# Add an entry here only to override that (an explicit mapping always wins) — shipping
# guesses would override discovery with the wrong field in orgs that differ.
testScenarioField: {}
acceptanceCriteriaField: {}
testerField: "" # identity field the sign-off tester is written to (e.g. Custom.Tester); empty = skip

hours:
  maxPerDay: 14
  idleGapMinutes: 30
  roundToHours: 0.5

fields:
  completedWork: true
  remainingWork: true
  state: true
  longText: [System.Description, Microsoft.VSTS.TCM.ReproSteps]
  # large-text fields written as Markdown (paired multilineFieldsFormat op)
  markdownFields: [System.Description, Microsoft.VSTS.Common.AcceptanceCriteria, Microsoft.VSTS.TCM.ReproSteps]

redact:
  extraPatterns: [] # additive only — base patterns cannot be removed
